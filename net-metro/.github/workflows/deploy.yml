name: Deploy NetMetro a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar supabaseConfig.js desde los Secrets del repositorio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > src/config/supabaseConfig.js <<EOF
          /**
           * Generado automáticamente por .github/workflows/deploy.yml a partir de los
           * Secrets del repositorio. NO editar a mano ni commitear: este archivo solo existe
           * en el artefacto de despliegue, nunca en el historial de git.
           */
          export const SUPABASE_CONFIG = {
            url: '${SUPABASE_URL}',
            anonKey: '${SUPABASE_ANON_KEY}'
          };
          EOF

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático (todo el proyecto, ya con la config generada)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
